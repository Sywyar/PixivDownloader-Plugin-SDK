name: Publish SDK Javadocs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-javadocs-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'sdk-api-v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/master
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test Pages builder
        run: npm test

      - name: Download every immutable SDK Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/releases
          mapfile -t tags < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | select(.tag_name | startswith("sdk-api-v")) | .tag_name')
          for tag in "${tags[@]}"; do
            if ! [[ "$tag" =~ ^sdk-api-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[1-9][0-9]*)?$ ]]; then
              echo "invalid SDK Release tag: $tag" >&2
              exit 1
            fi
            directory="target/releases/$tag"
            mkdir "$directory"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$directory" \
              --pattern 'PixivDownloader-Plugin-SDK-*.zip' \
              --pattern sdk-release.json \
              --pattern SHA256SUMS
          done

      - name: Verify Releases and build versioned Javadocs
        run: node scripts/build-pages.mjs --releases-dir target/releases --output target/pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
