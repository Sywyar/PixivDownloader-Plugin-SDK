name: Publish SDK Javadocs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-javadocs-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'sdk-api-v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    uses: Sywyar/PixivDownloader/.github/workflows/sdk-pages.yml@71ef80287c54418ae0db25f1e7319d939bcaf54e

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
